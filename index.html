<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة شطرنج</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #board {
            width: 400px;
            height: 400px;
            display: grid;
            grid-template-columns: repeat(8, 50px);
            border: 2px solid #333;
        }
        .square {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
        }
        .white { background: #eee; }
        .black { background: #333; color: white; }
    </style>
</head>
<body>
    <h1>لعبة شطرنج مع الذكاء الاصطناعي</h1>
    <div id="board"></div>
    
    <script>
        const board = document.getElementById("board");
        const pieces = {
            'P': '♟', 'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚',
            'p': '♙', 'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔'
        };
        const initialPosition = [
            'r', 'n', 'b', 'q', 'k', 'b', 'n', 'r',
            'p', 'p', 'p', 'p', 'p', 'p', 'p', 'p',
            '', '', '', '', '', '', '', '',
            '', '', '', '', '', '', '', '',
            '', '', '', '', '', '', '', '',
            '', '', '', '', '', '', '', '',
            'P', 'P', 'P', 'P', 'P', 'P', 'P', 'P',
            'R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R'
        ];

        function createBoard() {
            board.innerHTML = '';
            initialPosition.forEach((piece, index) => {
                const square = document.createElement("div");
                square.classList.add("square", (Math.floor(index / 8) + index) % 2 === 0 ? "white" : "black");
                square.innerHTML = piece ? pieces[piece] : '';
                board.appendChild(square);
            });
        }

        createBoard();
    </script>
</body>
</html>
